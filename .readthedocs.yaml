# .readthedocs.yaml
# Read the Docs configuration file
# Detailed configuration please refer to: https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

# Build documentation configuration file path
sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

# Install project dependencies (including Cython module)
python:
  install:
    - requirements: docs/requirements.txt
